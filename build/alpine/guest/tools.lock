# Packages the tools layer adds to the development image (resolved from guest/tools.pkgs), one per line:
#   name version repo origin sha256-of-the-.apk
# (repo "local": a package of the locally built repository, guest/tools.local; its last column is the datahash of the
# payload, which is the same in every environment, instead of the sha256 of the .apk)
# Official signed binary packages of the Alpine v3.24 repositories. Every version equals the pkgver-pkgrel of its
# origin aport in vendor/alpine-aports. make-tools.sh checks each sha256, apk verifies each signature against the
# Alpine release keys of the image. Refresh deliberately: make-tools.sh --refresh-lock, then review the diff.
